# Deployed on the shared WACRM VM as its own stack, alongside the existing
# `vedhanth` stack (web + db) and `web_admin` — all three join the
# pre-existing `wacrm_wacrm_network`, so this container reaches Postgres by
# the name `vedhanth_db` even though `db` is defined in a different
# docker-compose project, not this one. This stack owns nothing on the VM
# except its own container.
name: web_backend

services:
  backend:
    container_name: vedhanth_backend
    build:
      context: .
    restart: unless-stopped
    env_file: .env
    networks: [wacrm_wacrm_network]
    # No `ports:` — internal only. Reached by admin/frontend via the
    # container name `vedhanth_backend`, never exposed to the public
    # internet directly (no nginx route to it).

networks:
  wacrm_wacrm_network:
    external: true
