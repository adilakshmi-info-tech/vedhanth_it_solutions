# Deployed on the shared WACRM VM as its own stack (see
# Deploy_New_Website_on_WACRM_VM.md) — wacrm_nginx proxies to `vedhanth_web`
# over the pre-existing `wacrm_wacrm_network`. This stack owns nothing on
# that VM except its own two containers and ./data.
name: vedhanth

services:
  web:
    container_name: vedhanth_web
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/uploads:/app/public/uploads
    networks: [wacrm_wacrm_network]
    # No `ports:` — only reachable from other containers on the shared
    # network; wacrm_nginx proxy_passes to it by container name.

  db:
    container_name: vedhanth_db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [wacrm_wacrm_network]
    # Deliberately not on the shared network's WACRM db — this is vedhanth's
    # own private Postgres, just co-located on the same VM.

networks:
  wacrm_wacrm_network:
    external: true
