# Deployed on the shared WACRM VM alongside `al_backend` (web_backend repo)
# and `al_admin` (web_admin repo) — all three join the pre-existing
# `wacrm_wacrm_network` so this container can reach al_backend by name.
#
# This replaces the old vedhanth_web monolith (same repo, same deploy
# path at /opt/vedhanth) — container name stays client-specific
# (vedhanth_frontend, not al_frontend) since, unlike backend/admin, the
# public frontend is genuinely per-client by design, not shared platform
# infrastructure.
#
# The service key below is vedhanth_frontend, not the generic "frontend"
# — Compose auto-registers the service key itself as a network alias (on
# top of container_name) on every network it joins. wacrm_wacrm_network
# is shared with sm_technology's own frontend stack, which used the same
# generic "frontend" service key — both were registering the alias
# "frontend" on the same external network (same class of bug found on
# al_backend, which collided with WACRM's own "backend" service).
name: vedhanth

services:
  vedhanth_frontend:
    container_name: vedhanth_frontend
    build:
      context: .
    restart: unless-stopped
    env_file: .env
    networks: [wacrm_wacrm_network]
    # No `ports:` — wacrm_nginx proxy_passes to it by container name, same
    # as every other app here.

networks:
  wacrm_wacrm_network:
    external: true
