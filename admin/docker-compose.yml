# Deployed on the shared WACRM VM as its own stack, alongside the existing
# `vedhanth` stack (web + db) and `web_backend` — all three join the
# pre-existing `wacrm_wacrm_network` so this container can reach
# `vedhanth_backend` by name. This stack owns nothing on the VM except its
# own container.
name: web_admin

services:
  admin:
    container_name: vedhanth_admin
    build:
      context: .
      # Firebase's public web config is inlined into the client bundle at
      # build time — see the Dockerfile comment.
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
    restart: unless-stopped
    env_file: .env
    networks: [wacrm_wacrm_network]
    # No `ports:` — wacrm_nginx proxy_passes to it by container name, same
    # as vedhanth_web.

networks:
  wacrm_wacrm_network:
    external: true
